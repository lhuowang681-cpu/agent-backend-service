[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-mvp"
version = "0.1.0"
description = "Interview-oriented job-search multi-agent MVP with internalized fit verdict node."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2.6",
  "langgraph>=0.2",
  "matplotlib>=3.8",
  "psycopg[binary,pool]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.28",
  "pytest>=8.0",
]
ui = [
  "streamlit>=1.37",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_agent = ["interview/resources/*.json", "backend_service/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
